<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>CEO & CFO Task Board</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css" />
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: sans-serif; background: #f5f5f2; color: #111; padding: 2rem; }

  .board { max-width: 900px; margin: 0 auto; }
  .header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 1.5rem; flex-wrap: wrap; gap: 12px; }
  .logo { font-size: 13px; font-weight: 500; color: #888; letter-spacing: 0.08em; text-transform: uppercase; }
  .roles { display: flex; gap: 8px; }
  .role-badge { padding: 5px 14px; border-radius: 999px; font-size: 13px; font-weight: 500; cursor: pointer; border: 0.5px solid #ccc; background: #fff; color: #666; transition: all 0.15s; }
  .role-badge.active-ceo { background: #EEEDFE; color: #3C3489; border-color: #AFA9EC; }
  .role-badge.active-cfo { background: #E1F5EE; color: #085041; border-color: #5DCAA5; }

  .stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; margin-bottom: 1.25rem; }
  .stat { background: #ebebea; border-radius: 8px; padding: 10px 12px; }
  .stat-label { font-size: 11px; color: #666; margin-bottom: 3px; }
  .stat-val { font-size: 20px; font-weight: 500; color: #111; }

  .cols { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 12px; }
  .col { background: #ebebea; border-radius: 12px; padding: 1rem; min-height: 320px; }
  .col-title { font-size: 12px; font-weight: 500; letter-spacing: 0.06em; color: #666; text-transform: uppercase; margin-bottom: 12px; display: flex; align-items: center; gap: 6px; }
  .dot { width: 7px; height: 7px; border-radius: 50%; }
  .dot-todo { background: #888780; }
  .dot-doing { background: #378ADD; }
  .dot-done { background: #1D9E75; }

  .task-list { display: flex; flex-direction: column; gap: 8px; min-height: 60px; }
  .task { background: #fff; border: 0.5px solid #e0e0e0; border-radius: 8px; padding: 10px 12px; cursor: default; transition: border-color 0.15s; }
  .task:hover { border-color: #bbb; }
  .task-top { display: flex; align-items: flex-start; justify-content: space-between; gap: 8px; }
  .task-text { font-size: 13px; color: #111; line-height: 1.4; flex: 1; }
  .task-meta { display: flex; align-items: center; justify-content: space-between; margin-top: 7px; }

  .owner-pill { font-size: 11px; font-weight: 500; padding: 2px 8px; border-radius: 999px; }
  .pill-ceo { background: #EEEDFE; color: #3C3489; }
  .pill-cfo { background: #E1F5EE; color: #085041; }
  .pill-both { background: #FAEEDA; color: #633806; }

  .task-date { font-size: 11px; color: #aaa; }
  .move-btn { background: none; border: none; cursor: pointer; color: #888; font-size: 15px; padding: 0; line-height: 1; opacity: 0.6; }
  .move-btn:hover { opacity: 1; }
  .delete-btn { background: none; border: none; cursor: pointer; color: #bbb; font-size: 13px; padding: 0; line-height: 1; }
  .delete-btn:hover { color: #E24B4A; }

  .add-form { margin-top: 12px; }
  .add-input { width: 100%; font-size: 13px; padding: 8px 10px; border-radius: 8px; border: 0.5px solid #ccc; background: #fff; color: #111; resize: none; font-family: sans-serif; }
  .add-input:focus { outline: none; border-color: #999; }
  .form-row { display: flex; gap: 6px; margin-top: 6px; align-items: center; }
  .form-select { font-size: 12px; padding: 5px 8px; border: 0.5px solid #ccc; border-radius: 8px; background: #fff; color: #111; flex: 1; font-family: sans-serif; }
  .add-btn { font-size: 12px; font-weight: 500; padding: 5px 12px; border-radius: 8px; border: 0.5px solid #ccc; background: #fff; color: #111; cursor: pointer; white-space: nowrap; }
  .add-btn:hover { background: #f0f0ee; }
</style>
</head>
<body>
<div class="board">
  <div class="header">
    <div class="logo">Executive task board</div>
    <div style="display:flex;align-items:center;gap:10px;">
      <span style="font-size:12px;color:#888;">Viewing as</span>
      <div class="roles">
        <button class="role-badge active-ceo" id="btn-ceo" onclick="switchRole('CEO')">CEO</button>
        <button class="role-badge" id="btn-cfo" onclick="switchRole('CFO')">CFO</button>
      </div>
    </div>
  </div>

  <div class="stats" id="stats"></div>
  <div class="cols" id="board-cols"></div>
</div>

<script>
  // ── Global storage (shared across all users via window.storage API in Claude artifacts)
  // Outside Claude artifacts, tasks are stored in localStorage as a fallback.
  const STORAGE_KEY = 'exec-tasks-v2';
  let currentRole = 'CEO';

  const defaultTasks = [
    { id: 't1', text: 'Approve Q3 hiring budget',       owner: 'Both', status: 'todo',  date: '2026-05-22' },
    { id: 't2', text: 'Review Series B term sheet',     owner: 'CEO',  status: 'doing', date: '2026-05-21' },
    { id: 't3', text: 'Finalize cash flow forecast',    owner: 'CFO',  status: 'doing', date: '2026-05-23' },
    { id: 't4', text: 'Board deck preparation',         owner: 'Both', status: 'todo',  date: '2026-05-28' },
    { id: 't5', text: 'Vendor contract renegotiation',  owner: 'CFO',  status: 'todo',  date: '2026-05-30' },
    { id: 't6', text: 'Strategic partnership MOU',      owner: 'CEO',  status: 'done',  date: '2026-05-18' },
  ];

  // ── Storage helpers (window.storage = Claude artifact API; falls back to localStorage)
  async function loadTasks() {
    try {
      if (window.storage) {
        const res = await window.storage.get(STORAGE_KEY, true); // shared=true
        return res ? JSON.parse(res.value) : defaultTasks;
      }
    } catch {}
    // Fallback: localStorage
    try {
      const raw = localStorage.getItem(STORAGE_KEY);
      return raw ? JSON.parse(raw) : defaultTasks;
    } catch {}
    return defaultTasks;
  }

  async function saveTasks(tasks) {
    try {
      if (window.storage) {
        await window.storage.set(STORAGE_KEY, JSON.stringify(tasks), true); // shared=true
        return;
      }
    } catch {}
    try { localStorage.setItem(STORAGE_KEY, JSON.stringify(tasks)); } catch {}
  }

  // ── Role switcher
  function switchRole(role) {
    currentRole = role;
    document.getElementById('btn-ceo').className = 'role-badge' + (role === 'CEO' ? ' active-ceo' : '');
    document.getElementById('btn-cfo').className = 'role-badge' + (role === 'CFO' ? ' active-cfo' : '');
    render();
  }

  // ── Column definitions
  const cols = [
    { id: 'todo',  label: 'To do',       dotClass: 'dot-todo'  },
    { id: 'doing', label: 'In progress', dotClass: 'dot-doing' },
    { id: 'done',  label: 'Done',        dotClass: 'dot-done'  },
  ];
  const statusOrder = ['todo', 'doing', 'done'];
  const nextStatus = s => { const i = statusOrder.indexOf(s); return i < 2 ? statusOrder[i+1] : null; };
  const prevStatus = s => { const i = statusOrder.indexOf(s); return i > 0 ? statusOrder[i-1] : null; };

  // ── Task actions
  async function moveTask(id, dir) {
    const tasks = await loadTasks();
    const t = tasks.find(x => x.id === id);
    if (!t) return;
    const ns = dir === 'next' ? nextStatus(t.status) : prevStatus(t.status);
    if (ns) { t.status = ns; await saveTasks(tasks); render(); }
  }

  async function deleteTask(id) {
    const tasks = await loadTasks();
    await saveTasks(tasks.filter(x => x.id !== id));
    render();
  }

  async function addTask(text, owner, status) {
    if (!text.trim()) return;
    const tasks = await loadTasks();
    tasks.push({ id: 't' + Date.now(), text: text.trim(), owner, status, date: new Date().toISOString().slice(0,10) });
    await saveTasks(tasks);
    render();
  }

  function handleAdd(status, inputId, selId) {
    const text  = document.getElementById(inputId).value;
    const owner = document.getElementById(selId).value;
    if (text.trim()) {
      document.getElementById(inputId).value = '';
      addTask(text, owner, status);
    }
  }

  function escHtml(s) {
    return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  }

  // ── Render
  async function render() {
    const tasks   = await loadTasks();
    const visible = tasks.filter(t => t.owner === currentRole || t.owner === 'Both');

    // Stats bar
    document.getElementById('stats').innerHTML = `
      <div class="stat"><div class="stat-label">Total tasks</div><div class="stat-val">${visible.length}</div></div>
      <div class="stat"><div class="stat-label">To do</div><div class="stat-val">${visible.filter(t=>t.status==='todo').length}</div></div>
      <div class="stat"><div class="stat-label">In progress</div><div class="stat-val">${visible.filter(t=>t.status==='doing').length}</div></div>
      <div class="stat"><div class="stat-label">Done</div><div class="stat-val">${visible.filter(t=>t.status==='done').length}</div></div>
    `;

    // Kanban columns
    document.getElementById('board-cols').innerHTML = cols.map(col => {
      const colTasks = visible.filter(t => t.status === col.id);
      const inputId  = 'inp-' + col.id;
      const selId    = 'sel-' + col.id;

      const taskHTML = colTasks.map(t => `
        <div class="task">
          <div class="task-top">
            <span class="task-text">${escHtml(t.text)}</span>
            <button class="delete-btn" onclick="deleteTask('${t.id}')" aria-label="delete task">
              <i class="ti ti-trash" aria-hidden="true"></i>
            </button>
          </div>
          <div class="task-meta">
            <span class="owner-pill ${t.owner==='CEO'?'pill-ceo':t.owner==='CFO'?'pill-cfo':'pill-both'}">${t.owner}</span>
            <div style="display:flex;align-items:center;gap:6px;">
              <span class="task-date">${t.date}</span>
              ${prevStatus(t.status) ? `<button class="move-btn" onclick="moveTask('${t.id}','prev')" title="move back"><i class="ti ti-arrow-left" aria-hidden="true"></i></button>` : ''}
              ${nextStatus(t.status) ? `<button class="move-btn" onclick="moveTask('${t.id}','next')" title="move forward"><i class="ti ti-arrow-right" aria-hidden="true"></i></button>` : ''}
            </div>
          </div>
        </div>
      `).join('');

      return `
        <div class="col">
          <div class="col-title">
            <span class="dot ${col.dotClass}"></span>
            ${col.label}
            <span style="color:#bbb;font-weight:400;margin-left:2px;">(${colTasks.length})</span>
          </div>
          <div class="task-list">${taskHTML}</div>
          <div class="add-form">
            <textarea class="add-input" id="${inputId}" rows="2" placeholder="Add a task..."></textarea>
            <div class="form-row">
              <select class="form-select" id="${selId}">
                <option value="${currentRole}">${currentRole}</option>
                ${currentRole === 'CEO' ? '<option value="CFO">CFO</option>' : '<option value="CEO">CEO</option>'}
                <option value="Both">Both</option>
              </select>
              <button class="add-btn" onclick="handleAdd('${col.id}','${inputId}','${selId}')">
                <i class="ti ti-plus" aria-hidden="true"></i> Add
              </button>
            </div>
          </div>
        </div>
      `;
    }).join('');
  }

  render();
</script>
</body>

              </select>
              <button class="add-btn" onclick="handleAdd('${col.id}','${inputId}','${selId}')">
                <i class="ti ti-plus" aria-hidden="true"></i> Add
              </button>
            </div>
          </div>
        </div>
      `;
    }).join('');
  }

  render();
</script>
</body>
</html>
